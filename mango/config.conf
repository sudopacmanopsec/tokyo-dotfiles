# Imports
source=~/.config/mango/bind.conf
source=~/.config/mango/autostart.conf

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animations
animations=1
layer_animations=0
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.1
zoom_end_ratio=0.1
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=200
animation_duration_open=150
animation_duration_tag=200
animation_duration_close=200
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack
new_is_master=1
default_master_factor=0.55
default_master_count=1
smart_gaps=0

# Dwindle
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Overview
hotarea_size=10
enable_hotarea=0
hotarea_corner=2
overview_gap_inner=5
overview_gap_outer=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=0
idle_inhibit_ignore_visible=0
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=20
cursor_theme=Bibata-Modern-Classic
env=XCURSOR_SIZE,20
env=XCURSOR_THEME,Bibata-Modern-Classic
drag_tile_to_tile=1
drag_tile_small=1

# Keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Gestures
gesturebind=none,left,3,viewtoright
gesturebind=none,right,3,viewtoleft

# Appearance
enable_border_resize = 1
border_resize_size = 10
gap_inner_horizontal=1
gap_inner_vertical=1
gap_outer_horizontal=1
gap_outer_vertical=1
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=1

# Dimmed Tokyo Night
root_color=0x1a1b26ff
border_color=0x2a2c42ff
focus_color=0x7aa2f7ff
urgent_color=0xf7768eff
drop_color=0x9ece6aff
split_color=0xbb9af7ff
maximized_screen_color=0x7aa2f7ff
scratchpad_color=0x414868ff
global_color=0xbb9af7ff
overlay_color=0x7dcfffff

# workspaces
tag_rule=id:1,monitor_name:^HDMI-A-1$,layout_name:tile
tag_rule=id:1,monitor_name:^DP-2$,layout_name:vertical_tile

tag_rule=id:2,monitor_name:^HDMI-A-1$,layout_name:tile
tag_rule=id:2,monitor_name:^DP-2$,layout_name:vertical_tile

tag_rule=id:3,monitor_name:^HDMI-A-1$,layout_name:tile
tag_rule=id:3,monitor_name:^DP-2$,layout_name:vertical_tile

tag_rule=id:4,monitor_name:^HDMI-A-1$,layout_name:tile
tag_rule=id:4,monitor_name:^DP-2$,layout_name:vertical_tile

tag_rule=id:5,monitor_name:^HDMI-A-1$,layout_name:tile
tag_rule=id:5,monitor_name:^DP-2$,layout_name:vertical_tile

tag_rule=id:6,monitor_name:^HDMI-A-1$,layout_name:tile
tag_rule=id:6,monitor_name:^DP-2$,layout_name:vertical_tile

tag_rule=id:7,monitor_name:^HDMI-A-1$,layout_name:tile
tag_rule=id:7,monitor_name:^DP-2$,layout_name:vertical_tile

tag_rule=id:8,monitor_name:^HDMI-A-1$,layout_name:tile
tag_rule=id:8,monitor_name:^DP-2$,layout_name:vertical_tile

tag_rule=id:9,monitor_name:^HDMI-A-1$,layout_name:tile
tag_rule=id:9,monitor_name:^DP-2$,layout_name:vertical_tile


# Monitor
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:165.001007,x:1080,y:420
monitor_rule=name:^DP-2$,width:1080,height:1920,refresh:60,x:0,y:0,rr:1

# Layer rules
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi
layer_rule=no_blur:1,layer_name:selection

# Auto reload
auto_reload_config=1
